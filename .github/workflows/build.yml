name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: extensions/zotero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/zotero/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx ray build -e dist -o build --non-interactive
